<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender - MyOnlineFolder</title>

    <!-- Google Font Lobster -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <h1 class="header-title">NoteNest</h1>
    </header>

    <!-- Navbar -->
    <nav class="navbar">
        <ul>
            <li><a href="Start.html">Start</a></li>
            <li><a href="Neu.html">Neu</a></li>
            <li><a href="Ordner.html">Ordner</a></li>
            <li><a href="Kalender.html" class="active">Kalender</a></li>
        </ul>
    </nav>

    <!-- Hauptbereich -->
    <main class="content-area">

        <!-- Monats-Kopfzeile -->
        <div class="calendar-header">
            <button type="button" class="cal-nav-btn">&laquo; Vorheriger Monat</button>
            <h3 class="current-month">September 2026</h3>
            <button type="button" class="cal-nav-btn">Nächster Monat &raquo;</button>
        </div>

        <!-- Kalender-Grid (7 Spalten) -->
        <div class="calendar-grid">
            
            <!-- Spaltenüberschriften für die Wochentage -->
            <div class="day-label">Mo</div>
            <div class="day-label">Di</div>
            <div class="day-label">Mi</div>
            <div class="day-label">Do</div>
            <div class="day-label">Fr</div>
            <div class="day-label">Sa</div>
            <div class="day-label">So</div>

            <!-- Platzhalter für Tage des Vormonats -->
            <div class="calendar-day empty"></div>

            <!-- Die eigentlichen Monatstage (1 bis 30) -->
            <div class="calendar-day"><span class="day-num">1</span></div>
            <div class="calendar-day"><span class="day-num">2</span></div>
            <div class="calendar-day"><span class="day-num">3</span></div>
            <div class="calendar-day"><span class="day-num">4</span></div>
            <div class="calendar-day"><span class="day-num">5</span></div>
            <div class="calendar-day"><span class="day-num">6</span></div>

            <div class="calendar-day"><span class="day-num">7</span></div>
            <div class="calendar-day"><span class="day-num">8</span></div>
            <div class="calendar-day"><span class="day-num">9</span></div>
            <div class="calendar-day"><span class="day-num">10</span></div>
            <div class="calendar-day"><span class="day-num">11</span></div>
            <div class="calendar-day"><span class="day-num">12</span></div>
            <div class="calendar-day"><span class="day-num">13</span></div>

            <div class="calendar-day"><span class="day-num">14</span></div>
            <div class="calendar-day"><span class="day-num">15</span></div>
            <div class="calendar-day"><span class="day-num">16</span></div>
            <div class="calendar-day"><span class="day-num">17</span></div>
            <div class="calendar-day"><span class="day-num">18</span></div>
            <div class="calendar-day"><span class="day-num">19</span></div>
            <div class="calendar-day"><span class="day-num">20</span></div>

            <div class="calendar-day"><span class="day-num">21</span></div>
            <div class="calendar-day"><span class="day-num">22</span></div>
            <div class="calendar-day"><span class="day-num">23</span></div>
            <div class="calendar-day"><span class="day-num">24</span></div>
            <div class="calendar-day"><span class="day-num">25</span></div>
            <div class="calendar-day"><span class="day-num">26</span></div>
            <div class="calendar-day"><span class="day-num">27</span></div>

            <div class="calendar-day"><span class="day-num">28</span></div>
            <div class="calendar-day"><span class="day-num">29</span></div>
            <div class="calendar-day"><span class="day-num">30</span></div>

            <!-- Platzhalter für Tage des Folgemonats -->
            <div class="calendar-day empty"></div>
            <div class="calendar-day empty"></div>
            <div class="calendar-day empty"></div>
            <div class="calendar-day empty"></div>
        </div>
    </main>

</body>
</html>
