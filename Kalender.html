<!DOCTYPE html>
<html lang="de" spellcheck="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender - NoteNest</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

    <!-- Quill Editor Style -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <!-- Eigenes Stylesheet (Version auf 1.7 erhöht) -->
    <link rel="stylesheet" href="style.css?v=1.7">
    
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <a href="Start.html" class="logo-container">
            <img src="Image/NN.logo.schrift.png" alt="NoteNest Logo" class="header-logo">
        </a>

        <!-- Navigation -->
        <nav class="navbar">
            <ul>
                <li><a href="Start.html">Start</a></li>
                <li><a href="Neu.html">Notiz</a></li>
                <li><a href="Ordner.html">Ordner</a></li>
                <li><a href="Kalender.html" class="active">Kalender</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hauptbereich -->
    <main class="content-area">
        
        <!-- Kalender-Kopfzeile für Monatsnavigation -->
        <div class="calendar-header">
            <button class="cal-nav-btn" onclick="changeMonth(-1)">◀ Vorheriger Monat</button>
            <h2 id="currentMonthYear" class="current-month">Monat Jahr</h2>
            <button class="cal-nav-btn" onclick="changeMonth(1)">Nächster Monat ▶</button>
        </div>

        <!-- Kalender-Grid (7 Spalten) -->
        <div id="calendarGrid" class="calendar-grid">
            <!-- Wochentage & Tage werden dynamisch per script.js generiert -->
        </div>

        <!-- Steuerung unter dem Kalender: Button & Legende -->
        <div class="calendar-controls">
            <button id="openModalBtn" class="add-event-btn" onclick="openEventModal()">+ Hinzufügen</button>
            
            <div class="legend">
                <span class="legend-item"><span class="color-dot event"></span> Ereigniss</span>
                <span class="legend-item"><span class="color-dot task"></span> Aufgabe</span>
                <span class="legend-item"><span class="color-dot note"></span> Notiz</span>
                <span class="legend-item"><span class="color-dot urgent"></span> Wichtig</span>
            </div>
        </div>

        <!-- Tages-Detailansicht -->
        <div id="dayDetailSection" class="day-detail-section" style="display: none;">
            <div class="day-detail-header">
                <h3 id="selectedDateTitle">Einträge am Tag</h3>
                <button onclick="closeDayDetail()" class="btn-close-detail">✖ Schließen</button>
            </div>
            <div id="dayDetailContainer">
                <!-- Hier werden die Notizen, Aufgaben und Ereignisse geladen -->
            </div>
        </div>

    </main>

    <!-- Modal (Pop-up Fenster für Einträge im NoteNest-Design) -->
    <div id="eventModal" class="modal-overlay" style="display: none;" onclick="closeEventModalOnOverlay(event)">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Eintrag erstellen</h3>
                <button type="button" class="modal-close-icon" onclick="closeEventModal()">✖</button>
            </div>
            
            <form id="eventForm" class="editor-form" onsubmit="saveEvent(event)">
                <input type="hidden" id="eventId">

                <!-- Auswahl: Aufgabe (Grün) oder Ereignis (Blau) -->
                <div class="type-selector">
                    <input type="radio" id="typeTask" name="entryType" value="task" checked>
                    <label for="typeTask" class="type-btn-label">📋 Aufgabe</label>

                    <input type="radio" id="typeEvent" name="entryType" value="event">
                    <label for="typeEvent" class="type-btn-label">📅 Ereignis</label>
                </div>

                <div class="input-group">
                    <label for="eventTitle">Titel / Name:</label>
                    <input type="text" id="eventTitle" required placeholder="z. B. Hausaufgabe oder Meeting" autocomplete="off">
                </div>

                <div class="top-inputs-row">
                    <div class="input-group" style="flex: 1;">
                        <label for="eventDate">Datum:</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="input-group" style="flex: 1.5;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                            <label for="eventTime" style="margin-bottom: 0;">Uhrzeit:</label>
                            <label style="font-size: 12px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" id="eventAllDay" onchange="toggleAllDay(this.checked)"> Ganztägig
                            </label>
                        </div>
                        <div style="display: flex; gap: 5px; align-items: center;">
                            <input type="time" id="eventTime" required style="flex: 1;">
                            <span id="timeSeparator" style="font-size: 13px; font-weight: bold;">–</span>
                            <input type="time" id="eventEndTime" style="flex: 1;">
                        </div>
                    </div>
                </div>

                <!-- Zusatz Option für Wichtig -->
                <div class="input-group" style="flex-direction: row; align-items: center; gap: 8px;">
                    <input type="checkbox" id="eventUrgent" style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="eventUrgent" style="margin-bottom: 0; cursor: pointer; color: #dc3545; font-weight: bold;">Als "Wichtig" markieren</label>
                </div>

                <div class="input-group">
                    <label for="eventNotes">Notizen / Infos:</label>
                    <textarea id="eventNotes" rows="3" placeholder="Zusätzliche Informationen eingeben..."></textarea>
                </div>

                <div class="modal-actions" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <button type="button" id="goToCalendarBtn" class="add-event-btn" onclick="goToCalendarDate()" style="display: none;">📅 Im Kalender anzeigen</button>
                    <div style="display: flex; gap: 10px; margin-left: auto;">
                        <button type="submit" class="save-btn" id="saveEventBtn">Speichern</button>
                        <button type="button" class="cancel-btn" onclick="closeEventModal()">Abbrechen</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
