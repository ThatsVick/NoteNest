<!DOCTYPE html>
<html lang="de spellcheck="true"">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender - NoteNest</title>

    <!-- Google Font Lobster -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <!-- Externe JavaScript-Datei eingebunden -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <h1 class="header-title">NoteNest</h1>
    </header>

    <!-- Navbar -->
    <nav class="navbar">
        <ul>
            <li><a href="Start.html">Start</a></li>
            <li><a href="Neu.html">Neu</a></li>
            <li><a href="Ordner.html">Ordner</a></li>
            <li><a href="Kalender.html" class="active">Kalender</a></li>
        </ul>
    </nav>

    <!-- Hauptbereich -->
    <main class="content-area">
        
        <!-- Kalender-Kopfzeile für Monatsnavigation -->
        <div class="calendar-header">
            <button class="cal-nav-btn" onclick="changeMonth(-1)">◀ Vorheriger Monat</button>
            <h2 id="currentMonthYear" class="current-month">Monat Jahr</h2>
            <button class="cal-nav-btn" onclick="changeMonth(1)">Nächster Monat ▶</button>
        </div>

        <!-- Kalender-Grid (7 Spalten für Mo-So) -->
        <div id="calendarGrid" class="calendar-grid">
            <!-- Wochentage & Tage werden dynamisch per script.js generiert -->
        </div>

        <!-- Tages-Detailansicht (wird eingeblendet, wenn ein Tag angeklickt wird) -->
        <div id="dayDetailSection" style="margin-top: 25px; display: none; background: #fff; border: 1px solid #007bff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.08);">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e9f2ff; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 id="selectedDateTitle" style="margin: 0; color: #007bff;">Notizen am Tag</h3>
                <button onclick="closeDayDetail()" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">✖ Schließen</button>
            </div>
            <div id="dayDetailContainer">
                <!-- Hier werden die Notizen des geklickten Tages geladen -->
            </div>
        </div>

    </main>

</body>
</html>
