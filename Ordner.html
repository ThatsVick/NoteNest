<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NN.Ordner</title>

    <!-- Google Font Lobster -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <!-- Externe JavaScript-Datei eingebunden -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <h1 class="header-title">NoteNest</h1>
    </header>

    <!-- Navbar -->
    <nav class="navbar">
        <ul>
            <li><a href="Start.html">Start</a></li>
            <li><a href="Neu.html">Neu</a></li>
            <li><a href="Ordner.html" class="active">Ordner</a></li>
            <li><a href="Kalender.html">Kalender</a></li>
        </ul>
    </nav>

    <!-- Hauptbereich für die Ordner-Übersicht -->
    <main class="content-area">
        
        <!-- Zeile für den Button oben rechts -->
        <div class="top-action-row">
            <button type="button" class="add-folder-btn">+ Ordner hinzufügen</button>
        </div>

        <!-- Rasteransicht für die Ordner -->
        <div class="folder-grid">
            
            <div class="folder-card system-folder" onclick="openArchiveView()">
                <div class="folder-icon">📅</div>
                <div class="folder-name">Datums-Archiv</div>
                <div class="folder-info" id="archiveCountInfo">Lädt...</div>
            </div>

            <div class="folder-card">
                <div class="folder-icon">🖼️</div>
                <div class="folder-name">Bilder</div>
                <div class="folder-info">Alle Medien</div>
            </div>

            <div class="folder-card">
                <div class="folder-icon">📁</div>
                <div class="folder-name">Projekte</div>
                <div class="folder-info">0 Dateien</div>
            </div>

        </div>

        <!-- Datumsarchiv-Ansicht (inkl. Filter & Sortierung) -->
        <div id="archiveSection" style="margin-top: 30px; display: none;">
            <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h2>Gespeicherte Einträge</h2>
                
                <div style="display: flex; gap: 10px; align-items: center;">
                    <!-- Dropdown für Sortierung (auf- / absteigend) -->
                    <select id="sortSelect" onchange="loadArchive()" style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; background: white; cursor: pointer;">
                        <option value="date-desc">Datum: Neueste zuerst</option>
                        <option value="date-asc">Datum: Älteste zuerst</option>
                        <option value="title-asc">Name: A ➔ Z</option>
                        <option value="title-desc">Name: Z ➔ A</option>
                        <option value="tags-asc">Tags: A ➔ Z</option>
                        <option value="tags-desc">Tags: Z ➔ A</option>
                    </select>

                    <!-- Suchfeld für Tags und Thema -->
                    <input type="text" id="tagSearchInput" placeholder="Nach Tags oder Thema suchen..." onkeyup="filterArchive()" style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; width: 220px;">
                </div>
            </div>

            <div id="archiveContainer" class="archive-list">
                <!-- Hier werden die gespeicherten Einträge geladen -->
            </div>
        </div>

    </main>

</body>
</html>
