<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnorrisCave - Registrieren</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header-Bereich -->
    <header class="main-header">
        
        <!-- Linkes Logo (SnorrisCave) -->
        <a href="Start.html" class="logo-container">
            <img src="Image/sc.schrifft.png" alt="SnorrisCave Logo" class="header-logo">
        </a>

        <!-- Hauptnavigation -->
        <nav class="navbar">
            <ul>
                <li><a href="Start.html">Start</a></li>
                <li><a href="Neu.html">Notiz</a></li>
                <li><a href="Ordner.html">Ordner</a></li>
                <li><a href="Kalender.html">Kalender</a></li>
            </ul>
        </nav>

        <!-- Rechtes Login-Symbol (Führt zur Login-Seite) -->
        <a href="login.html">
            <img src="Image/sc.login.png" alt="SnorrisCave Login" class="header_login">
        </a>

    </header>

    <!-- Inhaltsbereich mit Registrierungs-Karte -->
    <main class="content-area">
        <div class="login-card">
            <h2>Konto erstellen</h2>
            <p class="login-subtitle">Werde Teil von SnorrisCave und verwalte deine Notizen & Aufgaben an einem Ort.</p>

            <form id="registerForm" class="editor-form" onsubmit="event.preventDefault(); alert('Registrierung wird vorbereitet!');">
                
                <div class="input-group">
                    <label for="regUsername">Benutzername:</label>
                    <input type="text" id="regUsername" required placeholder="z. B. SnorriFan" autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="regEmail">E-Mail-Adresse:</label>
                    <input type="email" id="regEmail" required placeholder="z. B. name@beispiel.de" autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="regPassword">Passwort:</label>
                    <input type="password" id="regPassword" required placeholder="Mindestens 8 Zeichen" autocomplete="new-password">
                </div>

                <div class="input-group">
                    <label for="regPasswordConfirm">Passwort wiederholen:</label>
                    <input type="password" id="regPasswordConfirm" required placeholder="Passwort erneut eingeben" autocomplete="new-password">
                </div>

                <div class="login-options" style="margin-top: 10px;">
                    <label class="remember-me">
                        <input type="checkbox" id="acceptTerms" required> Ich akzeptiere die <a href="#" style="color: #c85a28; text-decoration: none; font-weight: bold;">Nutzungsbedingungen</a>
                    </label>
                </div>

                <button type="submit" class="login-btn">Konto anlegen</button>

            </form>

            <div class="login-footer">
                <p>Du hast bereits ein Konto? <a href="login.html">Hier anmelden</a></p>
            </div>
        </div>
    </main>

</body>
</html>
