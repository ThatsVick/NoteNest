<!DOCTYPE html>
<html lang="de" spellcheck="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neu - NoteNest</title>

    <!-- Quill Editor CSS (Word-Style Werkzeugleiste) -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=1.1">
    
    <!-- Bibliotheken -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <!-- Externe JavaScript-Datei -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Header mit Logo links und Navbar mittig -->
    <header class="main-header">
        <a href="Start.html" class="logo-container">
            <img src="Image/NN.logo.schrift.png" alt="NoteNest Logo" class="header-logo">
        </a>

        <nav class="navbar">
            <ul>
                <li><a href="Start.html">Start</a></li>
                <li><a href="Neu.html" class="active">Neu</a></li>
                <li><a href="Ordner.html">Ordner</a></li>
                <li><a href="Kalender.html">Kalender</a></li>
            </ul>
        </nav>
    </header>

    <!-- Inhaltsbereich -->
    <main class="content-area">
        <form class="editor-form" id="noteForm" autocomplete="off" onsubmit="return false;">
            
            <!-- Oberste Leiste: Datum, Thema, Tags, Speichern-Button -->
            <div class="top-inputs-row">
                <div class="input-group">
                    <label for="datum">Datum</label>
                    <input type="date" id="datum" name="datum" required>
                </div>

                <div class="input-group">
                    <label for="thema">Thema</label>
                    <input type="text" id="thema" placeholder="Thema eingeben..." autocomplete="off" required>
                </div>

                <div class="input-group tags-group">
                    <label for="tags">Tags</label>
                    <input type="text" id="tags" placeholder="Schlagwörter mit Komma trennen..." autocomplete="off">
                </div>

                <div class="input-group save-group">
                    <label>&nbsp;</label>
                    <button type="button" class="save-btn" onclick="saveToArchive()">Speichern</button>
                </div>
            </div>

            <!-- Echter Word-Schreibbereich (Quill Editor) -->
            <div id="editorText" style="background: #ffffff; min-height: 50vh;"></div>

        </form>
    </main>

</body>
</html>
