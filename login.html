<!DOCTYPE html>
<html lang="de" spellcheck="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start - NoteNest</title>

    <link rel="stylesheet" href="style.css?v=1.1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <!-- Externe JavaScript-Datei -->
    <script src="script.js"></script>
</head>

<body>

    <!-- Header-Bereich: Enthält Logo und Navbar in einer Zeile -->
    <header class="main-header">
        
        <!-- Logo -->
        <a href="Start.html" class="logo-container">
            <img src="Image/sc.schrifft.png" alt="SnorrisCave" class="header-logo">
        </a>

        <!-- Navigationsleiste -->
        <nav class="navbar">
            <ul>
                <li><a href="Start.html">Start</a></li>
                <li><a href="Neu.html">Notiz</a></li>
                <li><a href="Ordner.html">Ordner</a></li>
                <li><a href="Kalender.html">Kalender</a></li>
            </ul>
        </nav>

    <a href="login.html" class="header_ligon">
        <img src="Image/sc.login.png" alt="SnorrisCave Login" class="header_login">
    </a>
    
    </header>

    <!-- Hauptbereich -->
    <main class="content-area">
    <div class="login-card">
        <h2>Anmelden bei SnorrisCave</h2>
        <p class="login-subtitle">Gib deine Zugangsdaten ein, um deine Notizen und Termine zu verwalten.</p>

        <form id="loginForm" class="editor-form" onsubmit="event.preventDefault(); alert('Login-Funktion wird vorbereitet!');">
            
            <div class="input-group">
                <label for="loginEmail">E-Mail oder Benutzername:</label>
                <input type="text" id="loginEmail" required placeholder="z. B. snorri@snorriscave.de" autocomplete="username">
            </div>

            <div class="input-group">
                <label for="loginPassword">Passwort:</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Angemeldet bleiben
                </label>
                <a href="#" class="forgot-password">Passwort vergessen?</a>
            </div>

            <button type="submit" class="login-btn">Anmelden</button>

        </form>

        <div class="login-footer">
            <p>Noch kein Konto? <a href="registrieren.html">Jetzt registrieren</a></p>
        </div>
    </div>
</main>



</body>
</html>
